<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Forms</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>


    <div class="container bg-success p-5 mt-5">
    <a href="style.css"></a>
    <form action="" method="post">

        <h2>Custom Sneaker Order Form</h2>

        <label for="form-name" class="form-label">Name:</label> 
        <input type="text" name="username" id="form-name" class="textinput form-control">
    
        <label for="form-email class=form-label">Email:</label> 
        <input type="email" name="emailaddress" id="form-email"class="textinput form-control">

        <label for="form-tel class=form-label">Telephone:</label> 
        <input type="tel" name="telephone" id="form-tel"class="textinput form-control">

        <label for="form-story class=form-label">Tell us about yourself:</label> 
        <textarea name="story" maxlength="600" id="form-story" class="textinput form-control" placeholder="No more than 600 characters long"></textarea>
        
        <label for="sizes">Size:</label>
        <select class="form-select" name="size" id="sizes">
            <option>5</option>
            <option>6</option>
            <option>7</option>
            <option>8</option>
            <option>9</option>
            <option>10</option>
            <option>11</option>
            <option>12</option>
            <option>13</option>
        </select> 
        
        <em>Sizes reflect standard US men's sizes</em>
            
        <label for="colors">Sneaker Color:</label>
        <fieldset id="colors">
            <legend>Color</legend>
            <label class="form-check-label"><input class="form-check-input" type="radio" name="color" value="red">Red</label>
            <label class="form-check-label"><input class="form-check-input" type="radio" name="color" value="blue"> Blue</label> 
            <label class="form-check-label"><input class="form-check-input" type="radio" name="color" value="black"> Black</label> 
            <label class="form-check-label"><input class="form-check-input" type="radio" name="color" value="silver"> Silver</label>
        </fieldset>
            
        <label for="features">Add-on Features:</label>
        <fieldset id="features">
            <legend>Feature</legend>

            <div class="form-check">
            <label><input type="checkbox" name="feature" value="laces"> Sparkley laces</label>
            </div>
            <label><input type="checkbox" name="feature" value="logo" checked> Metallic logo</label>
            <label><input type="checkbox" name="feature" value="heels"> Light-up heels</label>
            <label><input type="checkbox" name="feature" value="mp3"> MP3-enabled</label>

        </fieldset>

        <button class="btn btn-primary" type="submit" value="ENTER">
    </form>
    </div>
</body>
</html>
